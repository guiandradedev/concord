apiVersion: apps/v1                          # Versão da API
kind: Deployment                             # Tipo do manifesto
metadata:                                    #
  name: frontend                             # Identificação única do objeto
spec:                                        # Especificação do objeto
  selector:                                  # Identifica quais pods pertencem a este deployment
    matchLabels:                             #
      app: frontend                          #
  replicas: 1                                # Quantidade de réplicas do frontend
  template:                                  # Modelo do pod a ser criado
    metadata:                                #
      labels:                                # Qualquer pod criado terá a label app=frontend
        app: frontend                        #
    spec:                                    # Especificação do pod
      containers:                            #
      - name: frontend                       # Nome do container
        image: guiiandradedev/frontend:main  # Imagem publicada no Docker Hub pelo CI
        imagePullPolicy: Always              # Sempre verifica o Docker Hub para pegar a versão mais recente
        ports:                               # Portas expostas pelo container
        - containerPort: 3000                # Porta padrão do react-router-serve
          name: http                         #
        env:                                 # Variáveis de ambiente em runtime
        - name: PORT                         # Porta do servidor Node/React Router
          value: "3000"                      #
        - name: NODE_ENV                     # Modo de execução em produção
          value: "production"                #
        resources:                           # Limites adequados para o cluster Minikube (2800 MB)
          requests:                          #
            memory: "128Mi"                  #
            cpu: "50m"                       #
          limits:                            #
            memory: "256Mi"                  #
            cpu: "250m"                      #
        readinessProbe:                      # Só recebe tráfego quando o servidor SSR responder 200 OK
          httpGet:                           #
            path: /                          #
            port: http                       #
          initialDelaySeconds: 5             #
          periodSeconds: 5                   #
          failureThreshold: 3                #
        livenessProbe:                       # Reinicia o pod se o processo travar
          httpGet:                           #
            path: /                          #
            port: http                       #
          initialDelaySeconds: 15            #
          periodSeconds: 10                  #
          failureThreshold: 3                #
