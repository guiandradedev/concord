apiVersion: v1            # Versão da API
kind: Service             # Tipo de manifesto
metadata:                 #
  name: realtime-gateway  # Identificação única do objeto
spec:                     # Especificação do objeto
  selector:               #
    app: realtime-gateway # Pods com esta label recebem o tráfego
  ports:                  #
  - name: http            # Nome da porta
    port: 3000            # Porta de entrada do serviço
    targetPort: http      # Porta do container (containerPort 3000)
