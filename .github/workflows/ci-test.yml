name: CI Test Workflow

# Toda vez que fazer um push ou PR na main ou na development inicia uma execução do workflow
on: 
    push:
        branches:
            - main
            - development
            - tests/gateway
    pull_request:
        branches:
            - main
            - development
        types: [ opened, synchronize, reopened ]

jobs:
    gateway-test:
        name: Realtime Gateway Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./realtime-gateway

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Installing dependencies
              run: npm install

            - name: Running unit tests
              run: echo "Running tests..."   

    backend-test:
        name: Backend Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # Adicionar steps

            - name: Running unit tests
              run: echo "Running tests..."
    
