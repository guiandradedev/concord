name: CI Build And Publish Workflow

# Toda vez que fazer um push na main inicia um workflow de deploy: build and publish
on: 
    push:
        branches:
            - main

# Permissões necessárias
permissions:
  contents: read
  actions: write

# Controla execuções simultâneas do workflow
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
# ========================================================
# PIPELINE DE TESTES
# ========================================================
    tests:
      name: Run Tests
      uses: ./.github/workflows/tests-workflow.yml

# ========================================================
# PIPELINE DE BUILD e PUBLICAÇÃO DE IMAGENS
# ========================================================
    detect-changes:
      name: Detect Changes Job
      runs-on: ubuntu-latest
      needs: tests

      # Define "variaveis" de saída para serem usadas em outros jobs
      outputs:
        services: ${{ steps.filter.outputs.changes }}

      steps:
        - name: Checkout na branch
          uses: actions/checkout@v4

        # Utiliza action para detecctar mudanças nos diretórios dos microsserviços
        - name: Detecta mudanças
          uses: dorny/paths-filter@v3
          id: filter
          with:
            filters: |
              webserver:
                - 'webserver/**'
              realtime-gateway:
                - 'realtime-gateway/**'
              frontend:
                - 'frontend/**'

    # Job de build dinâmico que itera sobre os microsserviços que tiveram mudanças
    build:
      name: Build ${{ matrix.service }} Image
      runs-on: ubuntu-latest
      needs: detect-changes

      # Só executa o job de build se houver mudanças em ao menos um dos microsserviços
      if: needs.detect-changes.outputs.services != '[]'

      # Para evitar duplicação de código, utilizamos uma matriz para iterar sobre os microsserviços que tiveram mudanças e buildar suas imagens
      strategy:
        fail-fast: false 
        # Se um dos jobs falhar, permite continuar a execução dos outros jobs da matriz
        # Ele não realiza o publish se falhar, mas permite saber se os demais vão falhar também.
        matrix:
          # Converte a string JSON de serviços alterados em uma matriz para iterar sobre cada serviço
          service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

      steps:
        - name: Checkout na branch
          uses: actions/checkout@v4

        - name: Configura o Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Builda a imagem
          uses: docker/build-push-action@v6
          with:
            context: ./${{ matrix.service }}
            tags: ${{ matrix.service }}:${{ github.sha }}
            push: false # Impede de fazer push da imagem nesta etapa
            outputs: type=docker,dest=/tmp/image.tar # Gera um arquivo .tar e salva em /tmp/webserver.tar
            cache-from: type=gha,scope=${{ matrix.service }} # Usa o cache do GHA para acelerar o build da imagem
            cache-to: type=gha,mode=max,scope=${{ matrix.service }} # Salva o cache do build da imagem no GHA para acelerar builds futuros

        # Salva a imagem gerada como artefato para ser usaedo no job de deploy
        - name: Upload image
          uses: actions/upload-artifact@v4
          with:
            name: ${{ matrix.service }}-image
            path: /tmp/image.tar
            retention-days: 1 # Mantém o artefato por 1 dia, depois é deletado automaticamente

    publish:
      name: Publicação das imagens
      runs-on: ubuntu-latest
      needs: [ detect-changes, build ]

      # Só executa o job de publicação se houver mudanças em ao menos um dos microsserviços e se o build das imagens tiver sido bem-sucedido
      if: |
        always() &&
        needs.detect-changes.result == 'success' &&
        needs.detect-changes.outputs.services != '[]' &&
        needs.build.result == 'success'

      steps:
        - name: Download das imagens buildadas
          uses: actions/download-artifact@v4
          with:
            pattern: '*-image'
            path: /tmp/images
            merge-multiple: false

        - name: Login no Docker Hub
          uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Publicando as imagens no Docker Hub
          env:
            VERSION: ${{ github.sha }}
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          run: |
            set -euo pipefail

            for IMAGE_TAR in /tmp/images/*-image/image.tar; do

              SERVICE=$(basename "$(dirname "$IMAGE_TAR")")
              SERVICE=${SERVICE%-image}

              IMAGE="${DOCKER_USERNAME}/${SERVICE}:${VERSION}"

              echo "Loading ${SERVICE}..."

              docker load -i "$IMAGE_TAR"

              echo "Tagging ${IMAGE}..."

              docker tag "${SERVICE}:${VERSION}" "$IMAGE"

              echo "Publishing ${IMAGE}..."
              docker push "$IMAGE"

              IMAGE_MAIN="${DOCKER_USERNAME}/${SERVICE}:main"
              docker tag "${SERVICE}:${VERSION}" "$IMAGE_MAIN"
              echo "Publishing ${IMAGE_MAIN}..."
              docker push "$IMAGE_MAIN"

            done