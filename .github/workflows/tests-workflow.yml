name: "CI: Test Workflow"

# Workflow é executado quando é chamado por outro workflow
on:
  workflow_call:

permissions:
  contents: read
  actions: write

jobs:
    gateway-test:
        name: Realtime Gateway Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./realtime-gateway

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Installing dependencies
              run: npm install

            - name: Running unit tests
              run: npm test

    backend-test:
        name: Backend Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # Adicionar steps

            - name: Running unit tests
              run: echo "Running tests..."
    
    e2e-test:
        name: E2E Test
        runs-on: ubuntu-latest

        steps:
