              uses: actions/checkout@v4

            # Adicionar steps

            - name: Running tests
              run: echo "Running tests..."

    integration-test:
        name: Integration Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # Adicionar steps

            - name: Running tests
              run: echo "Running tests..."
